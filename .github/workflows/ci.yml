name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        run: uvx ruff check .
      - name: DSH plugin check
        run: npm --prefix dsh-plugin run check
      - name: Server unit tests
        run: python -m unittest discover -s server/tests -v

  reader-browser:
    # 阅读器页面回归；DSH 编辑器/样式回归依赖本机安装的 DeepSeek Harness，只在本地运行。
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Reader browser regression
        run: python server/tests/browser_monthly.py
