name: 功能建议
description: 新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
  - type: textarea
    id: boundary
    attributes:
      label: 边界影响
      description: 是否会写入 journal、改变 DSH 鉴权或引用协议、需要新的配置字段？
