name: 问题报告
description: 书房或 DSH 插件出现错误行为
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么，期望是什么。截图可直接粘贴。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 在 DSH 左栏打开谨迹书房\n2. ……"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 版本
      description: DeepSeek Harness 版本、插件提交号、Python 与 Node 版本、操作系统
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及部分
      options: [DSH 插件 Host, DSH 插件 Client, Python 服务, 阅读器页面, 不确定]
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私
      options:
        - label: 我确认报告中没有粘贴真实 journal 内容、令牌或其他敏感信息
          required: true
